# AI Canvas v0.11.11 - 生成时长 15s->30s · 构建 macOS Apple Silicon (arm64) DMG
#
# 源码固定官方 tag v0.11.11；补丁已 base64 内嵌，无需上传其它文件。
name: Build 30s macOS DMG (arm64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    # macos-14 是 Apple Silicon (arm64) runner
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout official v0.11.11
        uses: actions/checkout@v4
        with:
          repository: Tenney95/AI-Canvas-tauri
          ref: v0.11.11
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      # 内嵌 Python 补丁脚本解码执行（三处改动 + 校验，任一失败即中止）
      - name: Apply 30s duration patch
        shell: bash
        run: |
          python3 -c "import base64,sys;open('/tmp/patch.py','wb').write(base64.b64decode(sys.argv[1]))" 
          python3 /tmp/patch.py

      # 就地改 tauri.conf.json：关 updater、只打 dmg（macOS 无需签名私钥）
      - name: Adjust bundle config (DMG only)
        shell: bash
        run: |
          python3 <<'PYEOF'
          import json
          p = 'src-tauri/tauri.conf.json'
          with open(p, encoding='utf-8') as f:
              j = json.load(f)
          j['bundle']['createUpdaterArtifacts'] = False
          j['bundle']['targets'] = 'dmg'
          j.get('plugins', {}).pop('updater', None)
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(j, f, indent=2, ensure_ascii=False)
          print('targets =', j['bundle']['targets'], '| updater removed =', 'updater' not in j.get('plugins', {}))
          PYEOF

      # 关掉 local-onnx：ort-sys 要连 cdn.pyke.io 下载 ONNX Runtime，CI 连不上会编译失败。
      # 代码内 #[cfg(feature="local-onnx")] 有完整守卫与 fallback，不影响时长改动。
      - name: Disable local-onnx feature
        shell: bash
        run: |
          python3 <<'PYEOF'
          from pathlib import Path
          p = 'src-tauri/Cargo.toml'
          s = Path(p).read_text(encoding='utf-8')
          before = s
          s = s.replace('default = ["local-onnx"]', 'default = []')
          if s == before:
              raise SystemExit('Cargo.toml default feature line not found')
          Path(p).write_text(s, encoding='utf-8')
          print('local-onnx disabled:', 'default = []' in s)
          PYEOF

      - name: Install npm dependencies
        run: npm ci

      - name: Build macOS DMG
        shell: bash
        run: npx tauri build

      - name: Collect DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          found=$(find src-tauri/target/release/bundle -type f -name '*.dmg' | head -1)
          if [ -z "$found" ]; then echo 'No DMG produced' >&2; exit 1; fi
          cp "$found" artifacts/
          echo "Found: $found"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AI-Canvas-30s-macos-arm64-dmg
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
