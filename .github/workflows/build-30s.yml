# AI Canvas v0.11.11 - 生成时长 15s->30s · 一键构建 Windows 安装包
#
# ===== 用法（3 步，全程 GitHub 网页操作，不需要本地 Windows）=====
#  1. 打开 https://github.com/Tenney95/AI-Canvas-tauri 点 Fork 到自己账号
#  2. 在 fork 里新建 .github/workflows/build-30s.yml，把本文件全部内容粘进去提交
#  3. Actions 页 -> 选 "Build 30s Windows Installer" -> Run workflow
#     约 20-40 分钟后，在该次运行页底部 Artifacts 下载
#     "AI-Canvas-30s-windows-exe"，解压即得可直接安装的 .exe
#
# 源码固定官方 tag v0.11.11；补丁已 base64 内嵌，无需上传其它文件。
name: Build 30s Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout official v0.11.11
        uses: actions/checkout@v4
        with:
          repository: Tenney95/AI-Canvas-tauri
          ref: v0.11.11
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      # 内嵌补丁脚本解码执行（自带 CRLF 归一化 + 三处改动校验，任一失败即中止）
      - name: Apply 30s duration patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $b64 = ''
          [IO.File]::WriteAllBytes('apply-30s-patch.ps1', [Convert]::FromBase64String($b64))
          & ./apply-30s-patch.ps1

      # 就地改 tauri.conf.json：关 updater 产物(无官方签名私钥)、只打 NSIS。
      # 用 node 而非 PowerShell，避免 BOM / 转义 / 深度合并歧义；其余字段原样保留。
      - name: Adjust bundle config (no signing key, NSIS only)
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const p = 'src-tauri/tauri.conf.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.bundle.createUpdaterArtifacts = false;
          j.bundle.targets = 'nsis';
          delete j.plugins.updater;
          fs.writeFileSync(p, JSON.stringify(j, null, 2));
          console.log('bundle.targets =', j.bundle.targets, '| updater removed =', !j.plugins.updater);
          "

      - name: Install npm dependencies
        run: npm ci

      # 不传 --config，让 tauri 按官方 beforeBuildCommand 自动构建前端与 mcp 资源
      # --no-default-features 关闭 local-onnx: ort-sys 需要连 cdn.pyke.io 下载 ONNX Runtime,
      # GitHub Actions 美国机房连不上会编译失败。这正是官方 Legacy 包的做法(不含本地 ONNX),
      # 不影响视频生成时长改动。代码内有 #[cfg(feature="local-onnx")] 完整守卫与 fallback。
      - name: Build Windows installer
        shell: pwsh
        run: |
          npx tauri build --no-default-features
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed: $LASTEXITCODE" }

      - name: Collect installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $files = Get-ChildItem -Path 'src-tauri/target/release/bundle' -Recurse -Include *.exe -File
          if (-not $files) { throw 'No NSIS installer produced' }
          $files | ForEach-Object { Copy-Item $_.FullName artifacts/ -Force; Write-Host "Found: $($_.FullName)" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Canvas-30s-windows-exe
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
